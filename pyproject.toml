[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-job-hunt"
version = "0.2.0"
description = "Private production workflow for job discovery, review, and application documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "openai>=2,<3",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pillow>=10,<13",
    "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
